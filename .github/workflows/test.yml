# push·PR마다 GitHub 서버에서 백엔드 테스트를 돌린다.
# 테스트는 가짜 AI와 일회용 DB(Testcontainers, Docker)만 쓰므로 .env·비밀 정보가 필요 없다.
# 외부 액션은 태그 대신 커밋 번호(SHA)로 고정한다: 태그는 나중에 다른 코드로 옮겨질 수 있다.
name: test

on:
  push:
  pull_request:

# 코드를 읽기만 한다 (저장소에 쓰기 권한을 주지 않는다)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 내려받기·의존성 캐시 (두 번째 실행부터 빨라진다)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - run: ./gradlew test
