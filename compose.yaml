services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: readmanga
      POSTGRES_USER: readmanga
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # 이 맥북 안에서만 접속 가능 (집 네트워크에 DB를 노출하지 않음)
    volumes:
      - postgres-data:/var/lib/postgresql/data

  grobid:
    image: grobid/grobid:0.9.1-crf
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:8070:8070"   # 이 맥북 안에서만 접속 가능

volumes:
  postgres-data:
