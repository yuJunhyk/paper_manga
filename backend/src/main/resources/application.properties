spring.application.name=backend
# 이 컴퓨터에만 해당하는 값은 저장소 루트의 .env에서 읽어 온다 (양식: .env.example)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# 이 맥북 안에서만 접속 가능 (집 네트워크에 API를 노출하지 않음)
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# compose.yaml에서 127.0.0.1(IPv4)에만 열어 두었으므로 localhost 대신 127.0.0.1로 적는다
grobid.url=http://127.0.0.1:8070

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/readmanga
spring.datasource.username=readmanga
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# AI 서버(Ollama): 데스크탑을 먼저 쓰고, 응답이 없으면 맥북으로 자동 전환한다
ollama.primary-url=${OLLAMA_PRIMARY_URL}
ollama.fallback-url=http://127.0.0.1:11434
ollama.health-timeout=2s
ollama.request-timeout=10m
ollama.context-length=16384
ollama.fact-model=qwen3:8b
ollama.dialogue-model=exaone3.5:7.8b
