spring.application.name=backend
# 이 컴퓨터에만 해당하는 값은 저장소 루트의 .env에서 읽어 온다 (양식: .env.example)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# 이 컴퓨터 안에서만 접속 가능 (집 네트워크에 API를 노출하지 않음)
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# compose.yaml에서 127.0.0.1(IPv4)에만 열어 두었으므로 localhost 대신 127.0.0.1로 적는다
grobid.url=http://127.0.0.1:8070

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/readmanga
spring.datasource.username=readmanga
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# 지연 로딩 때 하나씩 묻지 않고 최대 100개씩 묶어서(IN 절) 묻는다. 만화 조회의 N+1 해결
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# AI 서버(Ollama): 주 서버를 먼저 쓰고, 응답이 없으면 예비 서버로 자동 전환한다 (주 서버 주소는 .env)
ollama.primary-url=${OLLAMA_PRIMARY_URL}
ollama.fallback-url=http://127.0.0.1:11434
ollama.health-timeout=2s
# 요청 하나의 최대 대기. 관측된 최장 요청은 1분 미만. 멎은 서버에 묶이는 시간을 줄이려고 10m → 3m
ollama.request-timeout=3m
# 예비 서버(맥북)는 몇 배 느리고 메모리가 부족하면 더 느려져서, 주 서버 기준(3분)이면 멀쩡해도 실패로 본다
ollama.fallback-request-timeout=10m
# 요청이 실패한 서버는 한동안 건너뛴다: 시간 초과(생성이 멎은 서버)는 길게, 연결 끊김(재시작 중인 서버)은 짧게
ollama.failure-cooldown=5m
ollama.reconnect-cooldown=10s
# 쓸 수 있는 서버가 하나도 없으면 바로 실패하지 않고 이 시간 동안 다시 연결되기를 기다린다
ollama.reconnect-wait=1m
# 한 번에 읽을 길이(토큰). 길수록 GPU 메모리를 더 쓴다. 16384로는 8GB 카드에 모델이 다 안 들어가 멎었다 → 8192
ollama.context-length=8192
ollama.dialogue-context-length=8192
# 답 하나의 최대 길이(토큰). 정상 답은 길어야 수백 토큰. 같은 말을 반복하는 고리에 빠져도 여기서 끊긴다
ollama.max-output-tokens=1500
# 반복 억제 (1.0이면 끔). Ollama 0.35의 기본값이 1.0이라 exaone이 같은 말을 반복하는 고리에 빠졌다. 1.1은 llama.cpp의 오랜 기본값
ollama.repeat-penalty=1.1
# 사실 모델: qwen3:8b → gemma4:e4b (2026-10-05). 같은 논문 비교(173 ↔ 174번)에서 틀린 사실 2 → 1, 사실 단계 92초 → 31초
# 예비 서버(맥북)에도 같은 모델이 있어야 한다
ollama.fact-model=gemma4:e4b
# 대본 모델: exaone3.5:7.8b → gemma4:e4b (2026-10-06). 같은 두 논문 비교(179·180 ↔ 184·185번)에서 대본 쓰기 약 6배 빠름,
# 말투·대사 길이 규칙을 더 잘 지킴. exaone3.5는 연구 목적 전용 라이선스라 배포할 수 없다(gemma4는 Apache 2.0)
ollama.dialogue-model=gemma4:e4b

# 로그를 파일로도 남긴다 (IntelliJ 콘솔을 닫아도 장애 원인을 다시 볼 수 있게). git에는 올리지 않는다
logging.file.name=logs/backend.log

# 대기 줄 길이: 논문 처리는 한 번에 하나만 하고(AI 서버가 하나), 나머지는 이만큼까지 줄 세운다. 꽉 차면 새 업로드는 429.
# 대기 작업마다 PDF(최대 50MB)를 메모리에 들고 있으므로 너무 크게 잡지 않는다 (5개 × 50MB = 최대 250MB)
readmanga.jobs.queue-capacity=5
